REM ============================================================================
REM custom_report local overrides (Guymager)
REM Perfil forense robusto + telemetria completa por dispositivo e por execução.
REM ============================================================================

REM -------------------------
REM Segurança / confiabilidade
REM -------------------------
CheckRootRights          = yes
CalcImageFileMD5         = on
AvoidEncaseProblems      = on
AvoidCifsProblems        = on
QueryDeviceMediaInfo     = on
DirectIO                 = off

REM -------------------------
REM Formato e compressão
REM -------------------------
DefaultFormat            = EWF
EwfFormat                = Encase6
EwfCompression           = BEST
EwfCompressionThreshold  = 0.999
EwfNaming                = FTK
AffEnabled               = TRUE
AffCompression           = 6
AffMarkBadSectors        = TRUE

REM -------------------------
REM Desempenho controlado
REM -------------------------
UseSeparatehashThread    = Yes
CompressionThreads       = AUTO
FifoBlockSizeDD          = 262144
FifoBlockSizeEWF         = 32768
FifoBlockSizeAFF         = 16777216

REM -------------------------
REM Confiabilidade de jobs
REM -------------------------
LimitJobs                = ON
JobMaxBadSectors         = 200
JobDisconnectTimeout     = 15000
BadSectorLogThreshold    = 0
BadSectorLogModulo       = 1000

REM -------------------------
REM Telemetria contínua (todos os dispositivos exibidos no Guymager)
REM -------------------------
RunStatsTemplateActive   = './runstats_active.template'
RunStatsTemplateEnded    = './runstats_ended.template'
RunStatsOutput           = '/var/log/forensic_framework/guymager_runstats.log'
RunStatsInterval         = 15

REM Relatório adicional no fim de cada aquisição
CommandAcquisitionEnd    = 'bash -c "mkdir -p /var/log/forensic_framework; role=OTHER; img=\"%Image%\"; case \"$img\" in /mnt/evidence/*) role=EVIDENCE ;; /mnt/target/*) role=TARGET ;; /mnt/backup/*) role=BACKUP ;; esac; line=$(printf \"[%s] role=%s state=%s ext=%s dev=%s serial=%s model=%s size=%s progress=%s avg=%s bad=%s image=%s info=%s verify_src=%s verify_dst=%s sha256=%s case=%s evidence=%s examiner=%s local=%s hidden=%s\\n\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \"$role\" \"%State%\" \"%ExtendedState%\" \"%Dev%\" \"%Serial%\" \"%Model%\" \"%SizeHumanNoSep%\" \"%Progress%\" \"%AverageSpeed%\" \"%BadSectors%\" \"%Image%\" \"%InfoFile%\" \"%VerifySrc%\" \"%VerifyDst%\" \"%CalcSHA256%\" \"%CaseNumber%\" \"%EvidenceNumber%\" \"%Examiner%\" \"%LocalDevice%\" \"%HiddenAreas%\"); printf %s \"$line\" >> /var/log/forensic_framework/acquisition_end.log; case \"$role\" in EVIDENCE) printf %s \"$line\" >> /var/log/forensic_framework/evidence_telemetry.log ;; TARGET) printf %s \"$line\" >> /var/log/forensic_framework/target_telemetry.log ;; BACKUP) printf %s \"$line\" >> /var/log/forensic_framework/backup_telemetry.log ;; *) printf %s \"$line\" >> /var/log/forensic_framework/other_telemetry.log ;; esac"'

REM -------------------------
REM Regras do diálogo de aquisição
REM -------------------------
TABLE DlgAcquireField NoName
   REM Field                Entry mode  Entry mode  Default
   REM name                 image       clone       value
   REM ------------------------------------------------------------------------------------
       'SplitFileSwitch'    ShowLast    Hide        '1'
       'SplitFileSize'      ShowLast    Hide        '2047'
       'SplitFileUnit'      ShowLast    Hide        'MiB'
       'EwfCaseNumber'      ShowLast    Hide        '%yyyy%%MM%%dd%'
       'EwfEvidenceNumber'  ShowLast    Hide        '%yyyy%%MM%%dd%'
       'EwfExaminer'        ShowLast    Hide        ''
       'EwfDescription'     ShowLast    Hide        '%model% - %serial%'
       'EwfNotes'           ShowLast    Hide        'Case:%EwfCaseNumber% Examiner:%EwfExaminer% Host:%HostName%'
       'UserField'          ShowLast    ShowLast    '%HostName%'
       'DestImageDirectory' ShowLast    Hide        '/mnt/evidence'
       'DestInfoDirectory'  ShowLast    ShowLast    '/var/log/forensic_framework'
       'DestImageFilename'  ShowLast    Hide        '%yyyy%%MM%%dd%_%model%_%serial%'
       'DestInfoFilename'   ShowLast    ShowLast    '%DestImageFilename%'
       'HashCalcMD5'        ShowLast    ShowLast    '1'
       'HashCalcSHA1'       ShowLast    ShowLast    '0'
       'HashCalcSHA256'     ShowLast    ShowLast    '1'
       'HashVerifySrc'      ShowLast    ShowLast    '1'
       'HashVerifyDst'      ShowLast    ShowLast    '1'
ENDTABLE

TABLE DlgAcquireRule NoName
   REM Trigger              Destination         Value
   REM field name           field name
   REM ----------------------------------------------------------------------
       'DestImageDirectory' 'DestInfoDirectory' '%DestImageDirectory%'
       'DestImageFilename'  'DestInfoFilename'  '%DestImageFilename%'
ENDTABLE

REM -------------------------
REM Telemetria detalhada de dispositivo (executada em Info + início de aquisição)
REM -------------------------
TABLE DeviceInfoCommands NoName
   REM Command
   REM -------------------------------------------
   'bash -c "echo === DEVICE CONTEXT ===; date -u +%Y-%m-%dT%H:%M:%SZ; echo DEV=%dev; readlink -f %dev; uname -a"'
   'bash -c "echo === LSBLK JSON ===; lsblk -J -b -O %dev 2>/dev/null || lsblk -O %dev"'
   'bash -c "echo === UDEV ALL ===; udevadm info --query=all --name=%dev"'
   'bash -c "echo === BLOCKDEV GEOMETRY ===; blockdev --getsize64 %dev; blockdev --getss %dev; blockdev --getpbsz %dev; blockdev --getiomin %dev; blockdev --getioopt %dev"'
   'bash -c "echo === SYSFS QUEUE ===; for f in rotational logical_block_size physical_block_size minimum_io_size optimal_io_size scheduler nr_requests read_ahead_kb discard_max_bytes discard_granularity write_cache zoned; do p=/sys/block/$(basename %dev)/queue/$f; [ -r $p ] && echo $f=$(cat $p); done"'
   'bash -c "echo === SMART EXTENDED ===; if command -v smartctl >/dev/null 2>&1; then smartctl -s on %dev; smartctl -x %dev; else echo smartctl_not_available; fi"'
   'bash -c "echo === NVME TELEMETRY ===; if command -v nvme >/dev/null 2>&1 && [[ $(basename %dev) == nvme* ]]; then nvme id-ctrl %dev; nvme smart-log %dev; nvme error-log %dev; nvme fw-log %dev; else echo nvme_not_applicable_or_missing; fi"'
   'bash -c "echo === ATA IDENTIFY ===; if command -v hdparm >/dev/null 2>&1; then hdparm -I %dev; else echo hdparm_not_available; fi"'
   'bash -c "echo === PARTITION MAP (fdisk/parted/sgdisk) ===; fdisk -l %dev; if command -v parted >/dev/null 2>&1; then parted -s %dev unit s print free; fi; if command -v sgdisk >/dev/null 2>&1; then sgdisk -p %dev; fi"'
   'bash -c "echo === FILESYSTEM SIGNATURES ===; blkid -p %dev 2>/dev/null || blkid %dev"'
   'bash -c "echo === READ CAPACITY (SCSI) ===; if command -v sg_readcap >/dev/null 2>&1; then sg_readcap -l %dev; else echo sg_readcap_not_available; fi"'
   'bash -c "echo === FORENSIC PATHS (evidence/target/backup) ===; for p in /mnt/evidence /mnt/target /mnt/backup; do echo --- $p ---; if [ -d $p ]; then findmnt -T $p -o TARGET,SOURCE,FSTYPE,OPTIONS -n 2>/dev/null || true; df -hT $p 2>/dev/null || true; else echo path_not_present; fi; done"'
   'bash -c "echo === HOST HARDWARE DMI (SERIAIS) ===; for f in bios_vendor bios_version bios_date board_name board_vendor board_serial board_asset_tag chassis_type chassis_vendor chassis_serial chassis_asset_tag product_name product_vendor product_version product_serial product_uuid; do p=/sys/class/dmi/id/$f; [ -r $p ] && echo $f=$(cat $p); done"'
   'bash -c "echo === HOST HARDWARE DMIDECODE ===; if command -v dmidecode >/dev/null 2>&1; then dmidecode -t system -t baseboard -t chassis -t bios -t processor -t memory; else echo dmidecode_not_available; fi"'
   'bash -c "echo === HOST CPU ===; lscpu; echo --- /proc/cpuinfo_first_120_lines ---; sed -n '"'"'1,120p'"'"' /proc/cpuinfo"'
   'bash -c "echo === HOST MEMORY ===; free -h; echo --- /proc/meminfo_first_120_lines ---; sed -n '"'"'1,120p'"'"' /proc/meminfo"'
   'bash -c "echo === HOST PCI/USB/STORAGE CONTROLLERS ===; if command -v lspci >/dev/null 2>&1; then lspci -nn; fi; if command -v lsusb >/dev/null 2>&1; then lsusb -v 2>/dev/null || lsusb; fi"'
   'bash -c "echo === HOST BLOCK TOPOLOGY ===; lsblk -e7 -o NAME,KNAME,TYPE,TRAN,SIZE,MODEL,SERIAL,WWN,VENDOR,REV,ROTA,HOTPLUG,STATE,MOUNTPOINT"'
   'bash -c "echo === HOST NVME INVENTORY ===; if command -v nvme >/dev/null 2>&1; then nvme list; for n in /dev/nvme*n1 /dev/nvme*n; do [ -e $n ] || continue; echo --- $n ---; nvme id-ctrl $n 2>/dev/null || true; nvme smart-log $n 2>/dev/null || true; done; else echo nvme_not_available; fi"'
   'bash -c "echo === HOST DISK SERIALS (UDEV) ===; for d in /dev/sd? /dev/nvme*n /dev/vd?; do [ -b $d ] || continue; echo --- $d ---; udevadm info --query=property --name=$d | egrep '"'"'^(ID_SERIAL|ID_SERIAL_SHORT|ID_WWN|ID_MODEL|ID_VENDOR|ID_REVISION)='"'"' || true; done"'
   'bash -c "echo === HOST NETWORK IDENTITY ===; hostnamectl 2>/dev/null || true; ip -br link; ip -br addr"'
   'bash -c "echo === KERNEL LOG HINTS ===; dmesg | tail -n 200"'
ENDTABLE

REM -------------------------
REM Dispositivos locais protegidos (evita aquisição acidental)
REM -------------------------
LocalHiddenDevicesUseRegExp = enabled

TABLE LocalDevices NoName
   REM Device
   REM -------------------------------------------
   '/dev/sda'
ENDTABLE

TABLE HiddenDevices NoName
   REM Device
   REM ---------------------
   '/dev/loop1[0-5]'
ENDTABLE
